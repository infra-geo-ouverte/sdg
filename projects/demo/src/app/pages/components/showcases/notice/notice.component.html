<p>
  <span
    >L'<b>avis</b> est un message contextuel qui peut s'afficher sur une page ou
    sur plusieurs pages d'un même sujet. Pour plus d'information, voir l'</span
  >
  <span
    ><sdg-external-link
      text="Avis"
      url="https://design.quebec.ca/design/composants/avis"
  /></span>
  <span>du Système de design gouvernemental.</span>
</p>

<app-example-viewer title="Avis" configFolder="notice" codeFolder="notice">
  <sdg-notice type="General" title="Ceci est un avis général">
    <p>{{ message }}</p>
  </sdg-notice>

  <sdg-notice type="Warning" title="Ceci est un avis d'avertissement">
    <p>{{ message }}</p>
  </sdg-notice>

  <sdg-notice type="Error" title="Ceci est un avis d'erreur">
    <p>{{ message }}</p>
  </sdg-notice>

  <sdg-notice type="Success" title="Ceci est un avis de succès">
    <p>{{ message }}</p>
    <a routerLink="">À propos</a>
  </sdg-notice>

  <sdg-notice
    type="Complementary"
    title="Ceci est un avis complémentaire avec l'icône par défaut"
  >
    <p>{{ message }}</p>
  </sdg-notice>

  <sdg-notice
    type="Complementary"
    icon="star"
    title="Ceci est un avis complémentaire avec une icône personnalisée"
  >
    <p>{{ message }}</p>
  </sdg-notice>
</app-example-viewer>
