@let labels = this.labels();

<sdg-map-browser
  [map]="map"
  sdgOlReferenceMapInteractions
  [messageDuration]="config()?.helpMessageDuration"
  [labels]="labels.restrictions"
  class="flex-fill"
>
  <div class="sdg-reference-map-actions --vertical --bottom --right">
    @let navigation = options().navigation;

    @if (navigation?.rotation !== false) {
      <sdg-rotation-button
        [map]="map"
        color="primary"
        [labels]="labels.buttons?.rotation"
      />
    }

    @if (navigation?.home !== false) {
      <sdg-home-button
        [map]="map"
        color="primary"
        [options]="homeOptions()"
        [labels]="labels.buttons?.home"
      />
    }

    @if (navigation?.geolocation !== false) {
      <sdg-geolocate-button
        [controller]="geolocation"
        color="primary"
        [labels]="labels.buttons?.geolocation"
      />
    }

    @if (navigation?.zoom !== false) {
      <sdg-zoom-button
        [map]="map"
        color="primary"
        [labels]="labels.buttons?.zoom"
      />
    }

    <ng-content />
  </div>
</sdg-map-browser>
