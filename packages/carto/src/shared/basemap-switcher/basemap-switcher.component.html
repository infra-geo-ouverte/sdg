@if (visible) {
  @let tooltipLabels = this.labels().tooltip;
  @let closeLabels = this.labels().close;
  @let expanded = this.expanded();

  <div
    class="sdg-basemap-switcher-container"
    [class.--expanded]="expanded"
    tabindex="0"
    role="button"
    [matTooltip]="!expanded ? tooltipLabels : undefined"
    [attr.aria-label]="tooltipLabels"
    [attr.aria-expanded]="expanded"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="toggle(); $event.preventDefault()"
    (touchend)="toggle(); $event.preventDefault()"
  >
    <div class="sdg-basemap-switcher-list">
      <ng-content />
    </div>

    @if (basemapCount() > 2) {
      <button
        matMiniFab
        class="sdg-basemap-switcher-more"
        [matTooltip]="closeLabels"
        matTooltipPosition="right"
      >
        <mat-icon color="primary">
          <!-- arrow_drop_down -->
          <svg viewBox="0 -960 960 960">
            <path d="M480-360 280-560h400L480-360Z" />
          </svg>
        </mat-icon>
      </button>
    }
  </div>
}
