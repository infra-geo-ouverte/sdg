<sdg-basemap-switcher
  [basemapCount]="basemaps().length"
  [(expanded)]="expanded"
  [labels]="labels()"
>
  @for (basemap of displayedBasemaps(); track basemap) {
    <sdg-ol-mini-basemap
      [parentMap]="map()"
      [basemap]="basemap"
      [title]="getTitle(basemap)"
      [display]="expanded() || displayedBasemaps().length === 1"
      [disabled]="!expanded() && basemaps().length > 2"
      (basemapSelect)="selectBasemap($event)"
    />
  }
</sdg-basemap-switcher>
