@let result = this.result();
@let resultIcon = result.icon;
@let resultSubtitleHtml = result.subtitleHtml;

<mat-list-item
  class="sdg-search-results-item"
  [class.--hovered]="hovered()"
  [class.--selected]="selected()"
  (click)="select.emit(result)"
  (mouseenter)="hover.emit(result)"
  (mouseleave)="unhover.emit(result)"
>
  <mat-icon matListItemIcon>
    @if (resultIcon) {
      {{ resultIcon }}
    } @else {
      <!-- location_on -->
      <svg viewBox="0 -960 960 960">
        <path
          d="M536.5-503.5Q560-527 560-560t-23.5-56.5Q513-640 480-640t-56.5 23.5Q400-593 400-560t23.5 56.5Q447-480 480-480t56.5-23.5ZM480-186q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z"
        />
      </svg>
    }
  </mat-icon>
  <span matListItemTitle [innerHTML]="result.titleHtml ?? result.title"></span>

  @if (resultSubtitleHtml) {
    <span matListItemLine [innerHTML]="resultSubtitleHtml"></span>
  }
</mat-list-item>
