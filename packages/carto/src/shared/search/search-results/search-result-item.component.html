<mat-list-item
  class="sdg-search-result-item"
  [class.--focused]="focused()"
  [class.--selected]="selected()"
  [matTooltip]="result().title"
  (click)="select.emit(result())"
  (mouseenter)="focus.emit(result())"
  (mouseleave)="unfocus.emit(result())"
>
  <mat-icon matListItemIcon>{{ result().icon ?? 'location_on' }}</mat-icon>
  <span
    matListItemTitle
    [innerHTML]="result().titleHtml ?? result().title"
  ></span>
  @if (result().subtitleHtml) {
    <span matListItemLine [innerHTML]="result().subtitleHtml"></span>
  }
</mat-list-item>
