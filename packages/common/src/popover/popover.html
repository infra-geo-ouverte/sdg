@let triggerAriaLabel = this.triggerAriaLabel(); @let labels = this.labels();
@let isOpen = this.isOpen();

<button
  matIconButton
  class="sdg-popover-button"
  color="primary"
  [attr.aria-label]="triggerAriaLabel"
  [attr.aria-expanded]="isOpen"
  aria-haspopup="dialog"
  [attr.aria-controls]="popoverId"
  [matTooltip]="
    isOpen ? labels.closeTooltip : (buttonTooltip() ?? labels.openTooltip)
  "
  (click)="toggle($event)"
>
  <mat-icon>
    @if (icon() === 'info') {
    <!-- info -->
    <svg viewBox="0 -960 960 960">
      <path
        d="M508.5-291.5Q520-303 520-320v-160q0-17-11.5-28.5T480-520q-17 0-28.5 11.5T440-480v160q0 17 11.5 28.5T480-280q17 0 28.5-11.5Zm0-320Q520-623 520-640t-11.5-28.5Q497-680 480-680t-28.5 11.5Q440-657 440-640t11.5 28.5Q463-600 480-600t28.5-11.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"
      />
    </svg>
    } @else {
    <!-- help -->
    <svg viewBox="0 -960 960 960">
      <path
        d="M513.5-254.5Q528-269 528-290t-14.5-35.5Q499-340 478-340t-35.5 14.5Q428-311 428-290t14.5 35.5Q457-240 478-240t35.5-14.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm4-572q25 0 43.5 16t18.5 40q0 22-13.5 39T502-525q-23 20-40.5 44T444-427q0 14 10.5 23.5T479-394q15 0 25.5-10t13.5-25q4-21 18-37.5t30-31.5q23-22 39.5-48t16.5-58q0-51-41.5-83.5T484-720q-38 0-72.5 16T359-655q-7 12-4.5 25.5T368-609q14 8 29 5t25-17q11-15 27.5-23t34.5-8Z"
      />
    </svg>
    }
  </mat-icon>
</button>

<ng-template #popoverContent>
  @let title = this.title();

  <div
    [id]="popoverId"
    class="sdg-popover-content"
    [class]="`--${resolvedPosition()}`"
    [style.--popover-arrow-offset]="arrowOffset()"
    role="dialog"
    [attr.aria-labelledby]="title ? titleId : null"
    [attr.aria-label]="title ? null : triggerAriaLabel"
  >
    <button
      matIconButton
      class="sdg-popover-close"
      color="primary"
      [matTooltip]="labels.closeTooltip"
      (click)="close()"
    >
      <mat-icon>
        <!-- close -->
        <svg viewBox="0 -960 960 960">
          <path
            d="M480-424 284-228q-11 11-28 11t-28-11q-11-11-11-28t11-28l196-196-196-196q-11-11-11-28t11-28q11-11 28-11t28 11l196 196 196-196q11-11 28-11t28 11q11 11 11 28t-11 28L536-480l196 196q11 11 11 28t-11 28q-11 11-28 11t-28-11L480-424Z"
          />
        </svg>
      </mat-icon>
    </button>

    <div class="sdg-popover-body">
      @if (title) {
      <span [id]="titleId" class="text sdg-popover-title">{{ title }}</span>
      }
      <div class="sdg-popover-message">
        <ng-content />
      </div>
    </div>
  </div>
</ng-template>
